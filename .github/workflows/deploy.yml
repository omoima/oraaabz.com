name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add the untracked page
        env:
          NTANDO_HTML: ${{ secrets.NTANDO_HTML }}
        run: |
          if [ -z "$NTANDO_HTML" ]; then
            echo "::error::NTANDO_HTML is missing"
            exit 1
          fi
          mkdir -p dist/ntando
          printf '%s' "$NTANDO_HTML" > dist/ntando/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
